<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assin Nsuta SHS ICT Department LMS & Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a', // Deep Academic Blue
                        secondary: '#4f46e5', // Indigo
                        accent: '#059669', // Emerald Green
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Toast Notification Box -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-white border-l-4 border-primary shadow-2xl rounded-r-xl p-4 flex items-center space-x-3 max-w-sm pointer-events-none">
        <div id="toast-icon" class="text-primary text-xl"></div>
        <div>
            <h4 id="toast-title" class="font-bold text-sm text-slate-900"></h4>
            <p id="toast-msg" class="text-xs text-slate-600"></p>
        </div>
    </div>

    <!-- Custom Modal Container -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 animate-fade-in">
            <div class="px-6 py-4 bg-slate-50 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-slate-900 text-base">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-6 text-sm text-slate-600 space-y-4 max-h-[75vh] overflow-y-auto"></div>
            <div id="modal-footer" class="px-6 py-3 bg-slate-50 border-t flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-semibold transition">Close</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-grow flex flex-col">
        <!-- Dynamic views injected here -->
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center max-w-7xl mx-auto w-full gap-2">
        <div>
            <strong>Assin Nsuta Agric SHS Science Department LMS & Portal</strong> &copy; 2026.
        </div>
        <div class="flex flex-wrap items-center justify-center gap-3">
            <span id="cloud-sync-badge" onclick="pullFromCloud(true)" class="cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition" title="Click to sync with Google Sheets Cloud">
                <i class="fas fa-cloud-upload-alt mr-1.5"></i> Cloud Sync Ready
            </span>
            <span id="network-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Online Mode
            </span>
        </div>
    </footer>

        function setCloudBadgeStatus(state, text) {
            const badge = document.getElementById('cloud-sync-badge');
            if (!badge) return;
            if (state === 'syncing') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800";
                badge.innerHTML = `<i class="fas fa-sync fa-spin mr-1.5"></i> ${text || 'Syncing Cloud...'}`;
            } else if (state === 'synced') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
                badge.innerHTML = `<i class="fas fa-cloud-check mr-1.5"></i> ${text || 'Cloud Synced'}`;
            } else if (state === 'pending') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
                badge.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1.5"></i> ${text || 'Queued Offline'}`;
            } else {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600";
                badge.innerHTML = `<i class="fas fa-cloud mr-1.5"></i> ${text || 'Local Mode (No Cloud URL)'}`;
            }
        }

        // Save table to localStorage AND push to Google Sheets Cloud
        async function saveTableAndSync(tableName, dataObj) {
            const storageKey = TABLE_KEY_MAP[tableName];
            if (!storageKey) return;
            localStorage.setItem(storageKey, JSON.stringify(dataObj));

            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Local Mode');
                return;
            }

            if (!navigator.onLine) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Saved Locally (Offline Queue)');
                return;
            }

            setCloudBadgeStatus('syncing', 'Saving to Cloud...');
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'SYNC_TABLE',
                        table: tableName,
                        records: dataObj
                    })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'Cloud Synced');
            } catch (err) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Sync Retry Queued');
            }
        }

        // Push ALL local tables to Google Sheets Cloud at once
        async function pushAllTablesToCloud(showNotification = true) {
            const url = getCloudSyncUrl();
            if (!url) {
                if (showNotification) showToast('Cloud URL Missing', 'Please paste your Google Apps Script Web App URL first.', true);
                return;
            }
            setCloudBadgeStatus('syncing', 'Pushing All Data...');
            const payloadData = {};
            Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                const raw = localStorage.getItem(TABLE_KEY_MAP[tableName]);
                payloadData[tableName] = raw ? JSON.parse(raw) : null;
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'SYNC_ALL',
                        data: payloadData
                    })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'All Data Pushed');
                if (showNotification) showToast('Cloud Push Complete', 'All local students, teachers, quizzes, and grades pushed to Google Sheets.');
            } catch (err) {
                setCloudBadgeStatus('pending', 'Push Failed');
                if (showNotification) showToast('Cloud Push Error', 'Could not reach Google Sheets. Check connection.', true);
            }
        }

        // Pull latest records from Google Sheets Cloud into browser localStorage
        async function pullFromCloud(showNotification = false) {
            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Local Mode');
                if (showNotification) showToast('Local Mode Active', 'HOD can add a Google Apps Script URL in Tab 6 to enable Cloud Sync.');
                return false;
            }
            if (!navigator.onLine) {
                setCloudBadgeStatus('pending', 'Offline Mode');
                return false;
            }

            setCloudBadgeStatus('syncing', 'Fetching Cloud Updates...');
            try {
                const res = await fetch(url + '?t=' + Date.now());
                const json = await res.json();
                if (json && json.status === 'success' && json.data) {
                    let updatedAny = false;
                    Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                        const cloudVal = json.data[tableName];
                        if (cloudVal !== null && cloudVal !== undefined) {
                            // Preserve cloudSyncUrl if pulling SETTINGS
                            if (tableName === 'SETTINGS') {
                                const localSettings = getSettings();
                                cloudVal.cloudSyncUrl = cloudVal.cloudSyncUrl || url;
                                cloudVal.adminPasscode = cloudVal.adminPasscode || localSettings.adminPasscode || 'admin123';
                                if (cloudVal.schoolCrestVersion !== SCHOOL_CREST_VERSION) {
                                    cloudVal.logoUrl = '';
                                    cloudVal.schoolCrestVersion = SCHOOL_CREST_VERSION;
                                }
                            }
                            localStorage.setItem(TABLE_KEY_MAP[tableName], JSON.stringify(cloudVal));
                            updatedAny = true;
                        }
                    });

                    // Refresh active logged-in user session if their record updated
                    const curr = getCurrentUser();
                    if (curr && curr.role === 'student') {
                        const stuList = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                        const freshStu = stuList.find(s => s.id === curr.id);
                        if (freshStu) localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'student', ...freshStu }));
                    } else if (curr && curr.role === 'teacher') {
                        const tchList = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                        const freshTch = tchList.find(t => t.id === curr.id);
                        if (freshTch) localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'teacher', ...freshTch }));
                    }

                    setCloudBadgeStatus('synced', 'Cloud Synced');
                    if (showNotification) showToast('Cloud Synced!', 'Latest updates from teachers and students loaded.');
                    if (updatedAny && !activeQuizState.timerInterval) {
                        renderApp();
                    }
                    return true;
                }
            } catch (err) {
                setCloudBadgeStatus('pending', 'Cloud Unreachable');
                if (showNotification) showToast('Sync Notice', 'Using cached offline data.', true);
            }
            return false;
        }

        function saveProfilePasscodeChange() {
            const user = getCurrentUser();
            if (!user) return;

            const currPass = (document.getElementById('sec-curr-pass').value || '').trim();
            const newPass = (document.getElementById('sec-new-pass').value || '').trim();
            const confPass = (document.getElementById('sec-conf-pass').value || '').trim();

            if (!currPass || !newPass || !confPass) {
                showToast('Missing Fields', 'Please fill in all passcode fields.', true);
                return;
            }

            if (newPass.length < 4) {
                showToast('Passcode Too Short', 'New passcode must be at least 4 characters.', true);
                return;
            }

            if (newPass !== confPass) {
                showToast('Mismatch', 'New passcode and confirmation do not match.', true);
                return;
            }

            if (user.role === 'student') {
                const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                const stu = students.find(s => s.id === user.id);
                if (!stu || stu.passcode !== currPass) {
                    showToast('Incorrect Passcode', 'Your current passcode is incorrect.', true);
                    return;
                }
                stu.passcode = newPass;
                user.passcode = newPass;
                localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user));
                saveTableAndSync('STUDENTS', students);
                closeModal();
                showToast('Passcode Updated & Synced!', 'Your new student login passcode has been saved to the cloud.');
            } else if (user.role === 'teacher') {
                const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                const tch = teachers.find(t => t.id === user.id);
                if (!tch || tch.passcode !== currPass) {
                    showToast('Incorrect Passcode', 'Your current staff passcode is incorrect.', true);
                    return;
                }
                tch.passcode = newPass;
                user.passcode = newPass;
                localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user));
                saveTableAndSync('TEACHERS', teachers);
                closeModal();
                showToast('Staff Passcode Synced!', 'Your new teacher login passcode has been saved to the cloud.');
            } else if (user.role === 'admin') {
                const settings = getSettings();
                const currentAdminPasscode = settings.adminPasscode || 'admin123';
                const legacyDefaultAccepted = !settings.adminPasscode && currPass === 'admin';

                if (currPass !== currentAdminPasscode && !legacyDefaultAccepted) {
                    showToast('Incorrect Passcode', 'Your current HOD/Admin passcode is incorrect.', true);
                    return;
                }

                settings.adminPasscode = newPass;
                localStorage.setItem(DB_KEYS.SETTINGS, JSON.stringify(settings));
                saveTableAndSync('SETTINGS', settings);
                closeModal();
                showToast('HOD/Admin Passcode Updated', 'Your new passcode has been saved. Cloud synchronization will follow the existing sync settings.');
            }
        }

        function getStudentProgressStats(studentId, studentClass) {
            const materials = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]');
            const progressMap = JSON.parse(localStorage.getItem(DB_KEYS.PROGRESS) || '{}');
            const completedIds = progressMap[studentId] || [];

            const assignedMaterials = materials.filter(m => isAssignedToStudent(m.classGroup, studentClass));
            const totalAssigned = assignedMaterials.length;
            if (totalAssigned === 0) return { completed: 0, total: 0, percentage: 100 };

            const completedCount = assignedMaterials.filter(m => completedIds.includes(m.id)).length;
            const percentage = Math.round((completedCount / totalAssigned) * 100);
            return { completed: completedCount, total: totalAssigned, percentage };
        }

        function getStudentQuizAverage(studentId) {
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]').filter(a => a.studentId === studentId);
            if (attempts.length === 0) return { count: 0, avg: null };
            const sum = attempts.reduce((acc, curr) => acc + curr.percentage, 0);
            return { count: attempts.length, avg: Math.round(sum / attempts.length) };
        }

        function getAllGradableAssessments() {
            const quizzes = JSON.parse(localStorage.getItem(DB_KEYS.QUIZZES) || '[]').map(q => ({
                id: q.id,
                title: q.title,
                type: 'Native LMS Quiz',
                maxScore: q.questions.length,
                classGroup: q.classGroup
            }));
            const extMats = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]')
                .filter(m => m.isGradable || m.category === 'Google Form' || m.category === 'GitHub HTML App' || m.category === 'External Task')
                .map(m => ({
                    id: m.id,
                    title: m.title,
                    type: m.category === 'External Task' ? 'Google Form / External' : m.category,
                    maxScore: parseInt(m.maxScore, 10) || 20,
                    classGroup: m.classGroup
                }));
            return [...quizzes, ...extMats];
        }

                    student = students.find(s => (s.username.toLowerCase() === inputUser || s.id.toLowerCase() === inputUser) && s.passcode === passcode);

                            <h3 class="text-xl font-black text-slate-900 mt-0.5">${students.length}</h3>
                            <p class="text-[10px] text-slate-400">45 ANASS Classes</p>
                        </div>
                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-teal-600">

                            <h3 class="text-xl font-black text-slate-900 mt-0.5">${teachers.length + 1}</h3>

                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-600">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Resources & Links</p>
                            <h3 class="text-xl font-black text-slate-900 mt-0.5">${materials.length}</h3>

                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-600">

                            <h3 class="text-xl font-black text-slate-900 mt-0.5">${quizzes.length}</h3>
                            <p class="text-[10px] text-slate-400">Auto-Grading</p>

                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-600">

                            <h3 class="text-xl font-black text-slate-900 mt-0.5">${attempts.length}</h3>
                            <p class="text-[10px] text-slate-400">Native + External</p>

                        <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500">

                        <button onclick="switchAdminTab('quizzes')" id="atab-quizzes-btn" class="py-3.5 font-bold text-xs uppercase tracking-wider border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap flex items-center space-x-1.5">

                        <button onclick="switchAdminTab('announcements')" id="atab-announcements-btn" class="py-3.5 font-bold text-xs uppercase tracking-wider border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap flex items-center space-x-1.5">

                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Bulk Student Generator -->
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center space-x-2">
                                        <i class="fas fa-users-cog text-emerald-600"></i>
                                        <span>Bulk Class Roster Import</span>
                                    </h3>

                                        ${generateClassOptions('1AGRIC', false)}

                                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                    <select id="roster-class-filter" onchange="filterStudentRoster()" class="px-3 py-1.5 border rounded-lg text-xs bg-white">
                                        <option value="ALL">Filter: All 45 Classes</option>
                                        ${generateClassOptions('', true)}
                                    </select>
                                    <input type="text" id="student-search" oninput="filterStudentRoster()" placeholder="Search name or ANASS ID..." class="px-3 py-1.5 border rounded-lg text-xs flex-grow sm:w-48">
                                    <button onclick="exportRosterCSV()" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-semibold hover:bg-slate-700 transition">
                                        <i class="fas fa-file-csv mr-1"></i> Export CSV
                                    </button>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">

                                        <tr class="bg-slate-100 text-[11px] text-slate-600 uppercase border-b">
                                            <th class="p-3">Student ID</th>
                                            <th class="p-3">Full Name</th>
                                            <th class="p-3">Assigned Class</th>
                                            <th class="p-3">Login Credentials</th>
                                            <th class="p-3">Lesson Progress</th>
                                            <th class="p-3">Overall Avg</th>
                                            <th class="p-3 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="admin-students-tbody" class="divide-y divide-slate-100">
                                        ${renderStudentRowsHTML(students)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                                            <label class="text-xs font-bold text-slate-600">Correct Answer:</label>
                                            <select id="b-correct" class="px-3 py-1.5 border rounded-lg text-xs bg-white font-bold text-emerald-700">

                                                <option value="3">Option D</option>

                                            </div>

        function processBulkExternalScores() {
            const sel = document.getElementById('bulk-ext-ass');
            const rawLines = document.getElementById('bulk-ext-lines').value.trim();
            if (!sel || !rawLines) return;

            const opt = sel.options[sel.selectedIndex];
            const quizId = sel.value;
            const quizTitle = opt.dataset.title;
            const assessmentType = opt.dataset.type;
            const total = parseFloat(opt.dataset.max) || 20;

            const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
            let attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
            const user = getCurrentUser();
            const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

            let importedCount = 0;
            rawLines.split('\n').forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const score = parseFloat(parts[1].trim());
                    const stu = students.find(s => s.id.toLowerCase() === key || s.username.toLowerCase() === key);
                    if (stu && !isNaN(score)) {
                        const percentage = Math.round((score / total) * 100);
                        attempts = attempts.filter(a => !(a.studentId === stu.id && a.quizId === quizId));
                        attempts.unshift({
                            id: genId('ATT'),
                            quizId,
                            quizTitle,
                            assessmentType,
                            studentId: stu.id,
                            studentName: stu.name,
                            classGroup: stu.classGroup,
                            score,
                            total,
                            percentage,
                            status: 'Verified (Bulk Import)',
                            verificationNote: 'Imported via CSV',
                            recordedBy: user ? user.name : 'Admin',
                            date: nowStr
                        });
                        importedCount++;
                    }
                }
            });

            saveTableAndSync('QUIZ_ATTEMPTS', attempts);
            closeModal();
            showToast('Bulk Score Import Synced', `Imported ${importedCount} student score(s) into the Gradebook.`);
            renderApp('quizzes');
        }

            const opt3 = document.getElementById('b-opt3').value.trim();
            const correct = parseInt(document.getElementById('b-correct').value, 10);

            if (!q || !opt0 || !opt1 || !opt2 || !opt3) {
                showToast('Incomplete Question', 'Please fill in the question prompt and all 4 options (A-D).', true);
                return;
            }

            builderQuestions.push({ q, options: [opt0, opt1, opt2, opt3], correct });
            document.getElementById('b-question').value = '';
            document.getElementById('b-opt0').value = '';
            document.getElementById('b-opt1').value = '';
            document.getElementById('b-opt2').value = '';
            document.getElementById('b-opt3').value = '';
            document.getElementById('builder-q-count').innerText = builderQuestions.length;
            document.getElementById('builder-questions-list').innerHTML = renderBuilderQuestionsPreview();
            showToast('Question Added', `Question #${builderQuestions.length} added to draft.`);
        }

        function removeBuilderQuestion(idx) {
            builderQuestions.splice(idx, 1);
            document.getElementById('builder-q-count').innerText = builderQuestions.length;
            document.getElementById('builder-questions-list').innerHTML = renderBuilderQuestionsPreview();
        }

        function publishNativeQuiz() {
            const title = document.getElementById('qz-title').value.trim();
            const timeLimit = parseInt(document.getElementById('qz-time').value, 10) || 10;
            const classGroup = document.getElementById('qz-class').value;
            const user = getCurrentUser();

            if (!title) {
                showToast('Missing Quiz Title', 'Please enter a title for the quiz.', true);
                return;
            }
            if (builderQuestions.length === 0) {
                showToast('No Questions Added', 'Please add at least 1 multiple-choice question to the quiz.', true);
                return;
            }

            const quizzes = JSON.parse(localStorage.getItem(DB_KEYS.QUIZZES) || '[]');
            quizzes.unshift({
                id: genId('QUIZ'),
                title,
                classGroup,
                timeLimit,
                author: user ? user.name : 'ICT Department',
                date: new Date().toISOString().split('T')[0],
                questions: [...builderQuestions]
            });

            saveTableAndSync('QUIZZES', quizzes);
            builderQuestions = [];
            showToast('Quiz Published & Synced!', `"${title}" is now live for ${classGroup}.`);
            renderApp('quizzes');
        }

        function deleteQuiz(id) {
            let quizzes = JSON.parse(localStorage.getItem(DB_KEYS.QUIZZES) || '[]');
            quizzes = quizzes.filter(q => q.id !== id);
            saveTableAndSync('QUIZZES', quizzes);
            showToast('Quiz Deleted', 'Quiz removed from portal.');
            renderApp('quizzes');
        }

        // --- ADMIN & TEACHER FORM LISTENERS & CRUD ---
        function attachAdminListeners() {
            const user = getCurrentUser();

            const addStuForm = document.getElementById('form-add-student');
            if (addStuForm) {
                addStuForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('new-stu-name').value.trim();
                    const classGroup = document.getElementById('new-stu-class').value;
                    const customUser = document.getElementById('new-stu-user').value.trim();
                    const customPass = document.getElementById('new-stu-pass').value.trim();

                    const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                    const id = 'ANASS-' + Math.floor(1000 + Math.random() * 9000);
                    const username = customUser || (name.toLowerCase().split(' ')[0].replace(/[^a-z]/g, '') + Math.floor(10 + Math.random() * 89));
                    const passcode = customPass || Math.floor(1000 + Math.random() * 9000).toString();

                    students.unshift({ id, name, username, passcode, classGroup });
                    saveTableAndSync('STUDENTS', students);
                    showToast('Credentials Created & Synced', `${name} (${id}) -> User: ${username} | PIN: ${passcode}`);
                    renderApp('students');
                });
            }

            const extScoreForm = document.getElementById('form-record-external-score');
            if (extScoreForm) {
                extScoreForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const stuId = document.getElementById('ext-stu-id').value;
                    const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                    const stu = students.find(s => s.id === stuId);
                    if (!stu) return;

                    const sel = document.getElementById('ext-ass-select');
                    let quizId = sel.value;
                    let quizTitle = '';
                    let assessmentType = 'Google Form';

                    if (quizId === 'CUSTOM') {
                        quizId = genId('EXT');
                        quizTitle = document.getElementById('ext-custom-title').value.trim() || 'External ICT Assessment';
                        assessmentType = document.getElementById('ext-custom-type').value;
                    } else {
                        const opt = sel.options[sel.selectedIndex];
                        quizTitle = opt.dataset.title;
                        assessmentType = opt.dataset.type;
                    }

                    const score = parseFloat(document.getElementById('ext-score').value) || 0;
                    const total = parseFloat(document.getElementById('ext-max').value) || 20;
                    const percentage = Math.round((score / total) * 100);
                    const note = document.getElementById('ext-note').value.trim() || 'Recorded by Teacher';
                    const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

                    let attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
                    attempts = attempts.filter(a => !(a.studentId === stu.id && a.quizId === quizId));
                    attempts.unshift({
                        id: genId('ATT'),
                        quizId,
                        quizTitle,
                        assessmentType,
                        studentId: stu.id,
                        studentName: stu.name,
                        classGroup: stu.classGroup,
                        score,
                        total,
                        percentage,
                        status: 'Verified',
                        verificationNote: note,
                        recordedBy: user ? user.name : 'Teacher',
                        date: nowStr
                    });

                    saveTableAndSync('QUIZ_ATTEMPTS', attempts);
                    showToast('External Score Synced', `Logged ${score}/${total} (${percentage}%) for ${stu.name}.`);
                    renderApp('quizzes');
                });
            }

            const addMatForm = document.getElementById('form-add-material');
            if (addMatForm) {
                addMatForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('mat-title').value.trim();
                    const category = document.getElementById('mat-category').value;
                    const classGroup = document.getElementById('mat-class').value;
                    const url = document.getElementById('mat-url').value.trim();
                    const description = document.getElementById('mat-desc').value.trim();
                    const isGradable = document.getElementById('mat-gradable').checked;
                    const maxScore = parseInt(document.getElementById('mat-max-score').value, 10) || 20;

                    const materials = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]');
                    materials.unshift({
                        id: genId('MAT'),
                        title,
                        category,
                        classGroup,
                        url,
                        description,
                        isGradable,
                        maxScore: isGradable ? maxScore : 0,
                        author: user ? user.name : 'ICT Admin',
                        date: new Date().toISOString().split('T')[0]
                    });
                    saveTableAndSync('MATERIALS', materials);
                    showToast('Resource Published & Synced', 'Material / External Assessment added to student hub.');
                    renderApp('content');
                });
            }

            const addAnnForm = document.getElementById('form-add-announcement');
            if (addAnnForm) {
                addAnnForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('ann-title').value.trim();
                    const content = document.getElementById('ann-content').value.trim();

                    const announcements = JSON.parse(localStorage.getItem(DB_KEYS.ANNOUNCEMENTS) || '[]');
                    announcements.unshift({
                        id: genId('ANN'),
                        title,
                        content,
                        author: user ? user.name : 'ICT Department',
                        date: new Date().toISOString().split('T')[0]
                    });
                    saveTableAndSync('ANNOUNCEMENTS', announcements);
                    showToast('Notice Posted & Synced', 'Department announcement broadcasted.');
                    renderApp('announcements');
                });
            }

            const addTtForm = document.getElementById('form-add-timetable');
            if (addTtForm) {
                addTtForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const classGroup = document.getElementById('tt-class').value;
                    const day = document.getElementById('tt-day').value;
                    const time = document.getElementById('tt-time').value.trim();
                    const lab = document.getElementById('tt-lab').value.trim();

                    const timetable = JSON.parse(localStorage.getItem(DB_KEYS.TIMETABLE) || '[]');
                    timetable.push({ id: genId('TT'), classGroup, day, time, lab, instructor: user ? user.name : '' });
                    saveTableAndSync('TIMETABLE', timetable);
                    showToast('Schedule Updated & Synced', 'Lab slot added.');
                    renderApp('announcements');
                });
            }

            const brandingForm = document.getElementById('form-save-branding');
            if (brandingForm && user && user.role === 'admin') {
                brandingForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const logoUrl = document.getElementById('brand-logo-url').value.trim();
                    const schoolName = document.getElementById('brand-school-name').value.trim();
                    const departmentName = document.getElementById('brand-dept-name').value.trim();
                    const motto = document.getElementById('brand-motto').value.trim();
                    const cloudSyncUrl = document.getElementById('brand-cloud-url').value.trim();

                    if (cloudSyncUrl) {
                        localStorage.setItem(DB_KEYS.CLOUD_URL, cloudSyncUrl);
                    }
                    const newSettings = { ...getSettings(), schoolName, departmentName, motto, logoUrl, cloudSyncUrl, schoolCrestVersion: SCHOOL_CREST_VERSION };
                    saveTableAndSync('SETTINGS', newSettings);
                    showToast('Settings & Cloud URL Saved!', 'School branding and cloud configuration updated.');
                    renderApp('settings');
                });
            }

            const addTeacherForm = document.getElementById('form-add-teacher');
            if (addTeacherForm && user && user.role === 'admin') {
                addTeacherForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('tch-name').value.trim();
                    const subjectRole = document.getElementById('tch-role').value.trim();

                    const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                    const id = 'STF-' + Math.floor(100 + Math.random() * 900);
                    const username = customUser || (name.toLowerCase().split(' ').pop().replace(/[^a-z]/g, '') + '.staff');
                    const passcode = customPass || Math.floor(1000 + Math.random() * 9000).toString();

                    teachers.push({ id, name, username, passcode, assignedClass, subjectRole });
                    saveTableAndSync('TEACHERS', teachers);
                    showToast('Teacher Added & Synced!', `${name} -> Username: ${username} | PIN: ${passcode}`);
                    renderApp('settings');
                });
            }
        }

        function toggleMaterialCompletion(matId) {
            const user = getCurrentUser();
            if (!user) return;

            const progressMap = JSON.parse(localStorage.getItem(DB_KEYS.PROGRESS) || '{}');
            const list = progressMap[user.id] || [];
            const idx = list.indexOf(matId);

            if (idx === -1) {
                list.push(matId);
                showToast('Progress Synced!', 'Lesson marked as completed.');
            } else {
                list.splice(idx, 1);
                showToast('Progress Updated', 'Lesson marked as incomplete.');
            }

            progressMap[user.id] = list;
            saveTableAndSync('PROGRESS', progressMap);
            renderApp('materials');

        // --- STUDENT INTERACTIVE QUIZ RUNNER ---
        function startStudentQuiz(quizId) {
            const quizzes = JSON.parse(localStorage.getItem(DB_KEYS.QUIZZES) || '[]');
            const quiz = quizzes.find(q => q.id === quizId);
            if (!quiz) return;

            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState = {
                quiz,
                answers: {},
                timerInterval: null,
                secondsRemaining: quiz.timeLimit * 60
            };

            const runner = document.getElementById('student-quiz-runner');
            runner.classList.remove('hidden');

            renderQuizRunnerUI();
            activeQuizState.timerInterval = setInterval(() => {
                activeQuizState.secondsRemaining--;
                const timerEl = document.getElementById('quiz-timer-display');
                if (timerEl) {
                    const mins = Math.floor(activeQuizState.secondsRemaining / 60);
                    const secs = activeQuizState.secondsRemaining % 60;
                    timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
                if (activeQuizState.secondsRemaining <= 0) {
                    clearInterval(activeQuizState.timerInterval);
                    submitStudentQuiz(true);
                }
            }, 1000);
        }

        function renderQuizRunnerUI() {
            const qz = activeQuizState.quiz;
            const runner = document.getElementById('student-quiz-runner');
            const mins = Math.floor(activeQuizState.secondsRemaining / 60);
            const secs = activeQuizState.secondsRemaining % 60;

            runner.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-3">
                    <div>
                        <span class="text-xs font-bold uppercase text-purple-600">Live Assessment Runner</span>
                        <h3 class="text-lg font-extrabold text-slate-900">${qz.title}</h3>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-1.5 rounded-xl font-mono font-bold text-sm flex items-center space-x-1.5">
                            <i class="fas fa-stopwatch"></i>
                            <span id="quiz-timer-display">${mins}:${secs < 10 ? '0' : ''}${secs}</span>
                        </div>
                        <button onclick="cancelQuizRunner()" class="text-xs text-slate-500 hover:text-slate-800 px-2 py-1">Cancel</button>
                    </div>
                </div>

                <div class="space-y-5">
                    ${qz.questions.map((item, qIdx) => `
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                            <h4 class="font-bold text-sm text-slate-900"><span class="text-indigo-600 mr-1">Q${qIdx + 1}.</span> ${item.q}</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${item.options.map((opt, oIdx) => `
                                    <label class="flex items-center space-x-2.5 p-2.5 bg-white border rounded-lg cursor-pointer hover:border-indigo-500 transition text-xs">
                                        <input type="radio" name="q-${qIdx}" value="${oIdx}" onchange="selectQuizAnswer(${qIdx}, ${oIdx})" class="text-indigo-600 focus:ring-indigo-500">
                                        <span class="font-bold text-slate-500">${['A','B','C','D'][oIdx]}.</span>
                                        <span class="text-slate-800 font-medium">${opt}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <button onclick="submitStudentQuiz(false)" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition">
                    <i class="fas fa-check-double mr-1"></i> Submit Quiz & Sync Score to Gradebook
                </button>
            `;
        }

        function selectQuizAnswer(qIdx, oIdx) {
            activeQuizState.answers[qIdx] = oIdx;
        }

        function cancelQuizRunner() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = null;
            document.getElementById('student-quiz-runner').classList.add('hidden');
        }

        function submitStudentQuiz(isAutoTimeout = false) {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = null;
            const qz = activeQuizState.quiz;
            const user = getCurrentUser();
            if (!qz || !user) return;

            let correctCount = 0;
            let reviewHTML = '';

            qz.questions.forEach((item, idx) => {
                const picked = activeQuizState.answers[idx];
                const isCorrect = picked === item.correct;
                if (isCorrect) correctCount++;

                reviewHTML += `
                    <div class="p-3 rounded-lg border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'} text-xs">
                        <div class="font-bold text-slate-900">Q${idx + 1}: ${item.q}</div>
                        <div class="mt-1">Your Answer: <b>${picked !== undefined ? item.options[picked] : 'Not Answered'}</b> ${isCorrect ? '<span class="text-emerald-700 font-bold">(Correct)</span>' : `<span class="text-red-700 font-bold">(Incorrect — Correct: ${item.options[item.correct]})</span>`}</div>
                    </div>
                `;
            });

            const total = qz.questions.length;
            const percentage = Math.round((correctCount / total) * 100);
            const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

            let attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
            attempts = attempts.filter(a => !(a.studentId === user.id && a.quizId === qz.id));
            attempts.unshift({
                id: genId('ATT'),
                quizId: qz.id,
                quizTitle: qz.title,
                assessmentType: 'Native LMS Quiz',
                studentId: user.id,
                studentName: user.name,
                classGroup: user.classGroup,
                score: correctCount,
                total,
                percentage,
                status: 'Auto-Graded',
                verificationNote: 'Built-in Quiz Runner',
                recordedBy: 'System',
                date: nowStr
            });
            saveTableAndSync('QUIZ_ATTEMPTS', attempts);

            openModal(
                isAutoTimeout ? 'Time Up! Quiz Auto-Submitted' : 'Quiz Graded & Synced to Cloud!',
                `
                    <div class="text-center p-4 bg-slate-50 rounded-xl border mb-4">
                        <p class="text-xs font-bold uppercase text-slate-500">${qz.title}</p>
                        <h2 class="text-3xl font-black ${percentage >= 50 ? 'text-emerald-600' : 'text-red-600'} mt-1">${percentage}%</h2>
                        <p class="text-xs font-semibold text-slate-700 mt-1">You scored ${correctCount} out of ${total} questions correctly.</p>
                    </div>
                    <div class="space-y-2">${reviewHTML}</div>
                `
            );

            renderApp('quizzes');
        }

                `,
                `
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">Cancel</button>
                    <button onclick="submitStudentExternalClaim('${mat.id}')" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-xs font-bold">Submit & Sync to Gradebook</button>
                `
            );
        }

        function submitStudentExternalClaim(matId) {
            const user = getCurrentUser();
            const materials = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]');
            const mat = materials.find(m => m.id === matId);
            if (!user || !mat) return;

            const score = parseFloat(document.getElementById('claim-score').value);
            const total = parseFloat(document.getElementById('claim-max').value) || 20;
            const note = document.getElementById('claim-note').value.trim() || 'Student Self-Report';

            if (isNaN(score) || score < 0 || score > total) {
                showToast('Invalid Score', `Please enter a valid score between 0 and ${total}.`, true);
                return;
            }

            const percentage = Math.round((score / total) * 100);
            const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

            let attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
            attempts = attempts.filter(a => !(a.studentId === user.id && a.quizId === mat.id));
            attempts.unshift({
                id: genId('ATT'),
                quizId: mat.id,
                quizTitle: mat.title,
                assessmentType: mat.category === 'External Task' ? 'Google Form' : mat.category,
                studentId: user.id,
                studentName: user.name,
                classGroup: user.classGroup,
                score,
                total,
                percentage,
                status: 'Pending Verification',
                verificationNote: note,
                recordedBy: 'Student Claim',
                date: nowStr
            });
            saveTableAndSync('QUIZ_ATTEMPTS', attempts);

            const progressMap = JSON.parse(localStorage.getItem(DB_KEYS.PROGRESS) || '{}');
            const list = progressMap[user.id] || [];
            if (!list.includes(mat.id)) {
                list.push(mat.id);
                progressMap[user.id] = list;
                saveTableAndSync('PROGRESS', progressMap);
            }

            closeModal();
            showToast('External Score Synced!', 'Sent to the Unified Gradebook for teacher verification.');
            renderApp('materials');
        }

        // --- CSV EXPORT & JSON BACKUP/RESTORE ---
        function downloadCSVFile(filename, rows) {
            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportRosterCSV() {
            const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
            const rows = [['Student ID', 'Full Name', 'Class Group', 'Username', 'Passcode', 'Material Completion %', 'Quiz Average %']];
            students.forEach(s => {
                const prog = getStudentProgressStats(s.id, s.classGroup);
                const qz = getStudentQuizAverage(s.id);
                rows.push([s.id, s.name, s.classGroup, s.username, s.passcode, prog.percentage + '%', qz.avg !== null ? qz.avg + '%' : 'N/A']);
            });
            downloadCSVFile('Assin_Nsuta_SHS_ICT_Roster_Progress.csv', rows);
            showToast('Export Complete', 'Student roster and progress CSV downloaded.');
        }

        function exportGradebookCSV() {
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
            const rows = [['Date', 'Student ID', 'Student Name', 'Class', 'Assessment Type', 'Assessment Title', 'Score', 'Total', 'Percentage', 'Status', 'Verification Note', 'Recorded By']];
            attempts.forEach(a => {
                rows.push([a.date, a.studentId, a.studentName, a.classGroup, a.assessmentType || 'Native LMS Quiz', a.quizTitle, a.score, a.total, a.percentage + '%', a.status || 'Verified', a.verificationNote || '', a.recordedBy || '']);
            });
            downloadCSVFile('Assin_Nsuta_SHS_ICT_Unified_Gradebook.csv', rows);
            showToast('Export Complete', 'Unified Gradebook CSV downloaded.');

        function exportFullDatabaseJSON() {
            const backup = {};
            Object.values(DB_KEYS).forEach(k => {
                if (k !== DB_KEYS.CURRENT_USER) {
                    backup[k] = JSON.parse(localStorage.getItem(k) || 'null');
                }
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const link = document.createElement('a');
            link.setAttribute("href", dataStr);
            link.setAttribute("download", `Assin_Nsuta_ICT_LMS_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Backup Downloaded', 'Full LMS database JSON saved.');
        }

        function importFullDatabaseJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    Object.keys(data).forEach(k => {
                        if (data[k] !== null) localStorage.setItem(k, JSON.stringify(data[k]));
                    });
                    closeModal();
                    showToast('Database Restored!', 'All LMS records have been imported.');
                    if (getCloudSyncUrl()) pushAllTablesToCloud(false);
                    renderApp();
                } catch (err) {
                    showToast('Import Error', 'Invalid backup JSON file.', true);
                }
            };
            reader.readAsText(file);
        }

        function logout() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = null;
            localStorage.removeItem(DB_KEYS.CURRENT_USER);
            showToast('Signed Out', 'Session closed safely.');
            renderApp();
        }

        // --- APP INITIALIZATION ---
        window.onload = async function() {
            initDatabase();
            renderApp();
            if (getCloudSyncUrl()) {
                await pullFromCloud(false);
            } else {
                setCloudBadgeStatus('local', 'Local Mode');
            }
        };
    </script>
</body>
</html>

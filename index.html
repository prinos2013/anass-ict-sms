        // --- TWO-WAY GOOGLE SHEETS CLOUD SYNC ENGINE ---
        function getCloudSyncUrl() {
            const s = getSettings();

        }

        function setCloudBadgeStatus(state, text) {
            const badge = document.getElementById('cloud-sync-badge');
            if (!badge) return;
            if (state === 'syncing') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800";
                badge.innerHTML = `<i class="fas fa-sync fa-spin mr-1.5"></i> ${text || 'Syncing Cloud...'}`;
            } else if (state === 'synced') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
                badge.innerHTML = `<i class="fas fa-cloud-check mr-1.5"></i> ${text || 'Cloud Synced'}`;
            } else if (state === 'pending') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
                badge.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1.5"></i> ${text || 'Queued Offline'}`;
            } else {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600";

            }
        }

        // Save table to localStorage AND push to Google Sheets Cloud
        async function saveTableAndSync(tableName, dataObj) {
            const storageKey = TABLE_KEY_MAP[tableName];
            if (!storageKey) return;
            localStorage.setItem(storageKey, JSON.stringify(dataObj));

            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Local Mode');
                return;
            }

            if (!navigator.onLine) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Saved Locally (Offline Queue)');
                return;
            }

            setCloudBadgeStatus('syncing', 'Saving to Cloud...');
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'SYNC_TABLE',
                        table: tableName,
                        records: dataObj
                    })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'Cloud Synced');
            } catch (err) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Sync Retry Queued');
            }
        }

        // Push ALL local tables to Google Sheets Cloud at once
        async function pushAllTablesToCloud(showNotification = true) {
            const url = getCloudSyncUrl();
            if (!url) {
                if (showNotification) showToast('Cloud URL Missing', 'Please paste your Google Apps Script Web App URL first.', true);
                return;
            }
            setCloudBadgeStatus('syncing', 'Pushing All Data...');
            const payloadData = {};
            Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                const raw = localStorage.getItem(TABLE_KEY_MAP[tableName]);
                payloadData[tableName] = raw ? JSON.parse(raw) : null;
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'SYNC_ALL',
                        data: payloadData
                    })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'All Data Pushed');
                if (showNotification) showToast('Cloud Push Complete', 'All local students, teachers, quizzes, and grades pushed to Google Sheets.');
            } catch (err) {
                setCloudBadgeStatus('pending', 'Push Failed');
                if (showNotification) showToast('Cloud Push Error', 'Could not reach Google Sheets. Check connection.', true);
            }
        }

        // Pull latest records from Google Sheets Cloud into browser localStorage
        async function pullFromCloud(showNotification = false) {
            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Local Mode');
                if (showNotification) showToast('Local Mode Active', 'HOD can add a Google Apps Script URL in Tab 6 to enable Cloud Sync.');
                return false;
            }
            if (!navigator.onLine) {
                setCloudBadgeStatus('pending', 'Offline Mode');
                return false;
            }

            setCloudBadgeStatus('syncing', 'Fetching Cloud Updates...');
            try {
                const res = await fetch(url + '?t=' + Date.now());
                const json = await res.json();
                if (json && json.status === 'success' && json.data) {
                    let updatedAny = false;
                    Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                        const cloudVal = json.data[tableName];
                        if (cloudVal !== null && cloudVal !== undefined) {
                            // Preserve cloudSyncUrl and adminPasscode if pulling SETTINGS
                            if (tableName === 'SETTINGS') {
                                cloudVal.cloudSyncUrl = cloudVal.cloudSyncUrl || url;
                                cloudVal.adminPasscode = cloudVal.adminPasscode || getSettings().adminPasscode || 'admin123';
                            }
                            localStorage.setItem(TABLE_KEY_MAP[tableName], JSON.stringify(cloudVal));
                            updatedAny = true;
                        }
                    });

                    // Refresh active logged-in user session if their record updated
                    const curr = getCurrentUser();
                    if (curr && curr.role === 'student') {
                        const stuList = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                        const freshStu = stuList.find(s => s.id === curr.id);
                        if (freshStu) localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'student', ...freshStu }));
                    } else if (curr && curr.role === 'teacher') {
                        const tchList = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                        const freshTch = tchList.find(t => t.id === curr.id);
                        if (freshTch) localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'teacher', ...freshTch }));
                    }

                    setCloudBadgeStatus('synced', 'Cloud Synced');
                    if (showNotification) showToast('Cloud Synced!', 'Latest updates from teachers and students loaded.');
                    if (updatedAny && !activeQuizState.timerInterval) {
                        renderApp();
                    }
                    return true;
                }
            } catch (err) {
                setCloudBadgeStatus('pending', 'Cloud Unreachable');
                if (showNotification) showToast('Sync Notice', 'Using cached offline data.', true);
            }
            return false;
        }

            let options = '';
            if (includeGroups) {
                options += `<option value="All Classes" ${selected === 'All Classes' ? 'selected' : ''}>All 45 Classes (Entire Department)</option>`;
                options += `<option value="All SHS 1" ${selected === 'All SHS 1' ? 'selected' : ''}>All SHS 1 Classes (15 Classes)</option>`;
                options += `<option value="All SHS 2" ${selected === 'All SHS 2' ? 'selected' : ''}>All SHS 2 Classes (15 Classes)</option>`;
                options += `<option value="All SHS 3" ${selected === 'All SHS 3' ? 'selected' : ''}>All SHS 3 Classes (15 Classes)</option>`;
            }
            Object.keys(ANASS_CLASSES).forEach(level => {
                options += `<optgroup label="${level} (15 Classes)">`;
                ANASS_CLASSES[level].forEach(clsName => {
                    options += `<option value="${clsName}" ${selected === clsName ? 'selected' : ''}>${clsName}</option>`;
                });
                options += `</optgroup>`;
            });
            return options;
        }

        function isAssignedToStudent(targetGroup, studentClass) {
            if (!studentClass) return false;
            if (targetGroup === 'All Classes') return true;
            if (targetGroup === studentClass) return true;
            if (targetGroup === 'All SHS 1' && (ANASS_CLASSES['SHS 1'].includes(studentClass) || studentClass.startsWith('1') || studentClass.startsWith('SHS 1'))) return true;
            if (targetGroup === 'All SHS 2' && (ANASS_CLASSES['SHS 2'].includes(studentClass) || studentClass.startsWith('2') || studentClass.startsWith('SHS 2'))) return true;
            if (targetGroup === 'All SHS 3' && (ANASS_CLASSES['SHS 3'].includes(studentClass) || studentClass.startsWith('3') || studentClass.startsWith('SHS 3'))) return true;
            return false;
        }

        function saveProfilePasscodeChange() {
            const user = getCurrentUser();
            if (!user) return;

            const currPass = (document.getElementById('sec-curr-pass').value || '').trim();
            const newPass = (document.getElementById('sec-new-pass').value || '').trim();
            const confPass = (document.getElementById('sec-conf-pass').value || '').trim();

            if (!currPass || !newPass || !confPass) {
                showToast('Missing Fields', 'Please fill in all passcode fields.', true);
                return;
            }

            if (newPass.length < 4) {
                showToast('Passcode Too Short', 'New passcode must be at least 4 characters.', true);
                return;
            }

            if (newPass !== confPass) {
                showToast('Mismatch', 'New passcode and confirmation do not match.', true);
                return;
            }

            if (user.role === 'student') {
                const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                const stu = students.find(s => s.id === user.id);
                if (!stu || stu.passcode !== currPass) {
                    showToast('Incorrect Passcode', 'Your current passcode is incorrect.', true);
                    return;
                }
                stu.passcode = newPass;
                user.passcode = newPass;
                localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user));
                saveTableAndSync('STUDENTS', students);
                closeModal();
                showToast('Passcode Updated & Synced!', 'Your new student login passcode has been saved to the cloud.');
            } else if (user.role === 'teacher') {
                const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                const tch = teachers.find(t => t.id === user.id);
                if (!tch || tch.passcode !== currPass) {
                    showToast('Incorrect Passcode', 'Your current staff passcode is incorrect.', true);
                    return;
                }
                tch.passcode = newPass;
                user.passcode = newPass;
                localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user));
                saveTableAndSync('TEACHERS', teachers);
                closeModal();
                showToast('Staff Passcode Synced!', 'Your new teacher login passcode has been saved to the cloud.');
            } else if (user.role === 'admin') {
                const s = getSettings();
                const currentAdminPass = s.adminPasscode || 'admin123';
                if (currentAdminPass !== currPass) {
                    showToast('Incorrect Passcode', 'Your current Admin passcode is incorrect.', true);
                    return;
                }
                s.adminPasscode = newPass;
                saveTableAndSync('SETTINGS', s);
                closeModal();
                showToast('Admin Passcode Updated & Synced!', 'Your new Super Admin passcode has been saved to the cloud.');
            }
        }

        function getStudentProgressStats(studentId, studentClass) {
            const materials = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]');
            const progressMap = JSON.parse(localStorage.getItem(DB_KEYS.PROGRESS) || '{}');
            const completedIds = progressMap[studentId] || [];

            const assignedMaterials = materials.filter(m => isAssignedToStudent(m.classGroup, studentClass));
            const totalAssigned = assignedMaterials.length;
            if (totalAssigned === 0) return { completed: 0, total: 0, percentage: 100 };

            const completedCount = assignedMaterials.filter(m => completedIds.includes(m.id)).length;
            const percentage = Math.round((completedCount / totalAssigned) * 100);
            return { completed: completedCount, total: totalAssigned, percentage };
        }

        function getStudentQuizAverage(studentId) {
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]').filter(a => a.studentId === studentId);
            if (attempts.length === 0) return { count: 0, avg: null };
            const sum = attempts.reduce((acc, curr) => acc + curr.percentage, 0);
            return { count: attempts.length, avg: Math.round(sum / attempts.length) };
        }

            const quizzes = JSON.parse(localStorage.getItem(DB_KEYS.QUIZZES) || '[]').map(q => ({

                type: 'Native LMS Quiz',
                maxScore: q.questions.length,
                classGroup: q.classGroup
            }));
            const extMats = JSON.parse(localStorage.getItem(DB_KEYS.MATERIALS) || '[]')
                .filter(m => m.isGradable || m.category === 'Google Form' || m.category === 'GitHub HTML App' || m.category === 'External Task')

                    type: m.category === 'External Task' ? 'Google Form / External' : m.category,
                    maxScore: parseInt(m.maxScore, 10) || 20,
                    classGroup: m.classGroup
                }));
            return [...quizzes, ...extMats];
        }

        function switchLoginTab(tab) {
            const stuForm = document.getElementById('form-student-login');
            const tchForm = document.getElementById('form-teacher-login');
            const admForm = document.getElementById('form-admin-login');
            const stuBtn = document.getElementById('tab-student-btn');
            const tchBtn = document.getElementById('tab-teacher-btn');
            const admBtn = document.getElementById('tab-admin-btn');

            stuForm.classList.add('hidden');
            tchForm.classList.add('hidden');
            admForm.classList.add('hidden');

            stuBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition";
            tchBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition";
            admBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 transition";

            if (tab === 'student') {
                stuForm.classList.remove('hidden');
                stuBtn.className = "py-2 text-xs font-bold rounded-lg bg-white shadow text-indigo-600 transition";
            } else if (tab === 'teacher') {
                tchForm.classList.remove('hidden');
                tchBtn.className = "py-2 text-xs font-bold rounded-lg bg-white shadow text-emerald-700 transition";
            } else {
                admForm.classList.remove('hidden');
                admBtn.className = "py-2 text-xs font-bold rounded-lg bg-white shadow text-primary transition";
            }
        }

        function attachLoginListeners() {
            document.getElementById('form-student-login').addEventListener('submit', async (e) => {
                e.preventDefault();
                const inputUser = document.getElementById('stu-username').value.trim().toLowerCase();
                const passcode = document.getElementById('stu-passcode').value.trim();

                let students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                let student = students.find(s => (s.username.toLowerCase() === inputUser || s.id.toLowerCase() === inputUser) && s.passcode === passcode);

                // If not found locally and cloud URL is configured, fetch latest cloud roster first
                if (!student && getCloudSyncUrl() && navigator.onLine) {
                    await pullFromCloud(false);
                    students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
                    student = students.find(s => (s.username.toLowerCase() === inputUser || s.id.toLowerCase() === inputUser) && s.passcode === passcode);
                }

                if (student) {
                    localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'student', ...student }));
                    showToast('Welcome Back!', `Logged in as ${student.name} (${student.classGroup})`);
                    renderApp();
                } else {
                    showToast('Authentication Error', 'Invalid Student Username/ID or Passcode.', true);
                }
            });

            document.getElementById('form-teacher-login').addEventListener('submit', async (e) => {
                e.preventDefault();
                const inputUser = document.getElementById('tch-username').value.trim().toLowerCase();
                const passcode = document.getElementById('tch-passcode').value.trim();

                let teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                let teacher = teachers.find(t => (t.username.toLowerCase() === inputUser || t.id.toLowerCase() === inputUser) && t.passcode === passcode);

                if (!teacher && getCloudSyncUrl() && navigator.onLine) {
                    await pullFromCloud(false);
                    teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                    teacher = teachers.find(t => (t.username.toLowerCase() === inputUser || t.id.toLowerCase() === inputUser) && t.passcode === passcode);
                }

                if (teacher) {
                    localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'teacher', ...teacher }));
                    showToast('Staff Portal Active', `Welcome, ${teacher.name} (${teacher.assignedClass})`);
                    renderApp();
                } else {
                    showToast('Authentication Error', 'Invalid Teacher Username/Staff ID or Passcode.', true);
                }
            });

            document.getElementById('form-admin-login').addEventListener('submit', (e) => {
                e.preventDefault();
                const pass = document.getElementById('admin-pass').value.trim();
                const currentAdminPass = getSettings().adminPasscode || 'admin123';
                
                if (pass === currentAdminPass) {
                    localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify({ role: 'admin', id: 'ADM-01', name: 'Mr. Appiah (HOD / Super Admin)', assignedClass: 'All Classes' }));
                    showToast('Super Admin Active', 'Welcome to the Assin Nsuta SHS ICT Control Panel.');
                    renderApp();
                } else {
                    showToast('Access Denied', 'Incorrect admin passcode.', true);
                }
            });
        }

                                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Select Assessment or Custom External Task</label>

                                        <div id="ext-custom-fields" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2">

                                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Max Possible Score</label>

                                        <div>
                                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Verification / Reference Note (Optional)</label>

                                        <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-emerald-700 transition shadow-sm">
                                            <i class="fas fa-save mr-1"></i> Save Score & Sync Gradebook
                                        </button>
                                    </form>
                                </div>

                                <!-- Published Native Quizzes List -->
                                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

                                                    <div class="flex items-center space-x-2">
                                                        <span class="bg-purple-100 text-purple-800 text-[10px] px-2 py-0.5 rounded font-bold">${q.questions.length} Qs • ${q.timeLimit}m</span>

                        </div>

                        <!-- Unified Gradebook Table -->

                                <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                                    <select id="gb-type-filter" onchange="filterGradebookTable()" class="px-3 py-1.5 border rounded-lg text-xs bg-white">
                                        <option value="ALL">All Types (Native + External)</option>
                                        <option value="Native LMS Quiz">Native LMS Quiz</option>
                                        <option value="Google Form">Google Form</option>
                                        <option value="GitHub HTML App">GitHub HTML App</option>
                                        <option value="Practical Assessment">Practical Assessment</option>
                                    </select>
                                    <select id="gb-class-filter" onchange="filterGradebookTable()" class="px-3 py-1.5 border rounded-lg text-xs bg-white">
                                        <option value="ALL">All 45 Classes</option>
                                        ${generateClassOptions('', true)}
                                    </select>
                                    <input type="text" id="gb-search" oninput="filterGradebookTable()" placeholder="Search student or task..." class="px-3 py-1.5 border rounded-lg text-xs">

                                            <th class="p-3">Verification / Status</th>
                                            <th class="p-3 text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="gradebook-tbody" class="divide-y divide-slate-100">
                                        ${renderGradebookRowsHTML(attempts)}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: LEARNING MATERIALS & EXTERNAL ASSESSMENT LINKS MANAGER -->
                    <div id="atab-content" class="space-y-6 hidden">

                            </h3>

                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Resource or External Task Title</label>

                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Format / Type</label>
                                    <select id="mat-category" onchange="handleMaterialCategoryChange()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                                        <option value="PDF">PDF Document</option>
                                        <option value="Word">Word Document (.docx)</option>
                                        <option value="Video">Video Tutorial (YouTube / MP4)</option>
                                        <option value="Audio">Audio Lecture (.mp3 / .ogg)</option>
                                        <option value="Google Form">Google Form Assessment (External Quiz)</option>
                                        <option value="GitHub HTML App">GitHub Pages HTML File / Interactive App</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Target Class or Year Group</label>

                                    </select>
                                </div>

                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Resource / Assessment URL (Google Forms, GitHub Pages, Drive, YouTube)</label>

                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Instructions / Summary</label>
                                    <input type="text" id="mat-desc" placeholder="Complete the questions and click 'Submit Score Claim' to log your score in the Gradebook..." class="w-full px-3 py-2 border rounded-lg text-sm">
                                </div>
                                <div class="bg-emerald-50/70 p-3 rounded-xl border border-emerald-200 flex items-center justify-between space-x-3">
                                    <div>
                                        <label class="flex items-center space-x-2 text-xs font-bold text-emerald-950 cursor-pointer">
                                            <input type="checkbox" id="mat-gradable" class="rounded text-emerald-600 focus:ring-emerald-500">
                                            <span>Include in Gradebook</span>
                                        </label>
                                        <p class="text-[10px] text-emerald-700 mt-0.5">Allows score tracking for this link</p>

                                    <div class="w-20">

                                    </div>
                                </div>
                                <div class="sm:col-span-3">
                                    <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-lg font-bold text-xs uppercase tracking-wider hover:bg-emerald-700 transition">Publish Resource & Sync to Cloud</button>
                                </div>
                            </form>
                        </div>

                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="p-4 bg-slate-50 border-b"><h4 class="font-bold text-sm text-slate-700">Published Learning Materials & External Assessment Links (${materials.length})</h4></div>
                            <div class="divide-y divide-slate-100">
                                ${materials.map(m => `
                                    <div class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <div class="flex flex-wrap items-center gap-2">
                                                <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-bold">${m.category}</span>
                                                <span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded font-medium">${m.classGroup}</span>

                                                <span class="text-xs text-slate-400">${m.date} ${m.author ? '• By ' + m.author : ''}</span>
                                            </div>

                                            <p class="text-xs text-slate-500">${m.description || ''}</p>

                                        </div>
                                        <button onclick="deleteMaterial('${m.id}')" class="text-red-500 hover:text-red-700 text-xs px-3 py-1.5 bg-red-50 rounded font-semibold shrink-0"><i class="fas fa-trash"></i> Remove</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: PROJECT SUBMISSIONS & GRADING -->
                    <div id="atab-submissions" class="space-y-6 hidden">

                                            <th class="p-3">Class</th>

                                                </td>
                                            </tr>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 5: ANNOUNCEMENTS & LAB TIMETABLE -->

                                    <span>Broadcast Department Notice</span>

                                    <button type="submit" class="w-full py-2 bg-amber-50 text-white rounded-lg font-bold text-xs uppercase hover:bg-amber-600 transition">Post Notice & Sync</button>

                    <!-- TAB 6: SCHOOL LOGO / BRANDING (ADMIN ONLY), CLOUD SYNC & STAFF DIRECTORY -->

        function renderGradebookRowsHTML(attemptsList) {
            if (attemptsList.length === 0) {
                return `<tr><td colspan="7" class="p-6 text-center text-slate-400 text-sm">No assessment records match the current filter.</td></tr>`;
            }
            return attemptsList.map(a => {
                const aType = a.assessmentType || 'Native LMS Quiz';
                const badgeColor = aType === 'Native LMS Quiz'
                    ? 'bg-purple-100 text-purple-800'
                    : (aType === 'Google Form' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800');
                const statusBadge = a.status === 'Pending Verification'
                    ? `<span class="bg-amber-100 text-amber-800 text-[11px] px-2 py-0.5 rounded-full font-bold">Pending Verification</span>`
                    : `<span class="bg-emerald-50 text-emerald-700 text-[11px] px-2 py-0.5 rounded-full font-semibold">${a.status || 'Verified'}</span>`;

                return `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 text-xs text-slate-500 whitespace-nowrap">${a.date}</td>
                        <td class="p-3">
                            <div class="font-bold text-slate-800 text-xs">${a.studentName} <span class="text-indigo-600">(${a.studentId})</span></div>
                            <div class="text-[11px] text-slate-500">${a.classGroup}</div>
                        </td>
                        <td class="p-3">
                            <span class="${badgeColor} text-[10px] px-2 py-0.5 rounded font-bold uppercase">${aType}</span>
                            <div class="font-semibold text-slate-800 text-xs mt-1">${a.quizTitle}</div>
                        </td>
                        <td class="p-3 font-bold text-xs">${a.score} / ${a.total}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${a.percentage >= 50 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                ${a.percentage}%
                            </span>
                        </td>
                        <td class="p-3">
                            ${statusBadge}
                            <div class="text-[10px] text-slate-400 mt-0.5">${a.verificationNote || ''} ${a.recordedBy ? '• ' + a.recordedBy : ''}</div>
                        </td>
                        <td class="p-3 text-center whitespace-nowrap space-x-1">
                            ${a.status === 'Pending Verification' ? `<button onclick="verifyExternalScore('${a.id}')" class="px-2 py-1 bg-emerald-600 text-white rounded text-[11px] font-bold hover:bg-emerald-700" title="Approve Claim"><i class="fas fa-check"></i> Verify</button>` : ''}

            }).join('');

        function filterGradebookTable() {
            const typeFilter = document.getElementById('gb-type-filter').value;
            const classFilter = document.getElementById('gb-class-filter').value;
            const query = document.getElementById('gb-search').value.trim().toLowerCase();
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');

            const filtered = attempts.filter(a => {
                const aType = a.assessmentType || 'Native LMS Quiz';
                const matchesType = typeFilter === 'ALL' || aType === typeFilter;
                const matchesClass = classFilter === 'ALL' || isAssignedToStudent(classFilter, a.classGroup);
                const matchesQuery = !query || a.studentName.toLowerCase().includes(query) || a.studentId.toLowerCase().includes(query) || a.quizTitle.toLowerCase().includes(query);
                return matchesType && matchesClass && matchesQuery;
            });

            document.getElementById('gradebook-tbody').innerHTML = renderGradebookRowsHTML(filtered);
        }

        function processBulkExternalScores() {
            const sel = document.getElementById('bulk-ext-ass');
            const rawLines = document.getElementById('bulk-ext-lines').value.trim();
            if (!sel || !rawLines) return;

            const opt = sel.options[sel.selectedIndex];
            const quizId = sel.value;
            const quizTitle = opt.dataset.title;
            const assessmentType = opt.dataset.type;
            const total = parseFloat(opt.dataset.max) || 20;

            const students = JSON.parse(localStorage.getItem(DB_KEYS.STUDENTS) || '[]');
            let attempts = JSON.parse(localStorage.getItem(DB_KEYS.QUIZ_ATTEMPTS) || '[]');
            const user = getCurrentUser();
            const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

            let importedCount = 0;
            rawLines.split('\n').forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const score = parseFloat(parts[1].trim());
                    const stu = students.find(s => s.id.toLowerCase() === key || s.username.toLowerCase() === key);
                    if (stu && !isNaN(score)) {
                        const percentage = Math.round((score / total) * 100);
                        attempts = attempts.filter(a => !(a.studentId === stu.id && a.quizId === quizId));
                        attempts.unshift({
                            id: genId('ATT'),
                            quizId,
                            quizTitle,
                            assessmentType,
                            studentId: stu.id,
                            studentName: stu.name,
                            classGroup: stu.classGroup,
                            score,
                            total,
                            percentage,
                            status: 'Verified (Bulk Import)',
                            verificationNote: 'Imported via CSV',
                            recordedBy: user ? user.name : 'Admin',
                            date: nowStr
                        });
                        importedCount++;
                    }
                }
            });

            saveTableAndSync('QUIZ_ATTEMPTS', attempts);
            closeModal();
            showToast('Bulk Score Import Synced', `Imported ${importedCount} student score(s) into the Gradebook.`);
            renderApp('quizzes');
        }

        function downloadCSVFile(filename, rows) {
            const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            students.forEach(s => {
                const prog = getStudentProgressStats(s.id, s.classGroup);
                const qz = getStudentQuizAverage(s.id);
                rows.push([s.id, s.name, s.classGroup, s.username, s.passcode, prog.percentage + '%', qz.avg !== null ? qz.avg + '%' : 'N/A']);
            });
            downloadCSVFile('Assin_Nsuta_SHS_ICT_Roster_Progress.csv', rows);
            showToast('Export Complete', 'Student roster and progress CSV downloaded.');

                        <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Restore Database from JSON File</label>
                            <input type="file" id="json-restore-input" accept=".json" onchange="importFullDatabaseJSON(event)" class="text-xs w-full">
                        </div>
                    </div>
                `
            );
        }

        function exportFullDatabaseJSON() {
            const backup = {};
            Object.values(DB_KEYS).forEach(k => {
                if (k !== DB_KEYS.CURRENT_USER) {
                    backup[k] = JSON.parse(localStorage.getItem(k) || 'null');
                }
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const link = document.createElement('a');
            link.setAttribute("href", dataStr);
            link.setAttribute("download", `Assin_Nsuta_ICT_LMS_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Backup Downloaded', 'Full LMS database JSON saved.');
        }

        function importFullDatabaseJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    Object.keys(data).forEach(k => {
                        if (data[k] !== null) localStorage.setItem(k, JSON.stringify(data[k]));
                    });
                    closeModal();
                    showToast('Database Restored!', 'All LMS records have been imported.');
                    if (getCloudSyncUrl()) pushAllTablesToCloud(false);
                    renderApp();
                } catch (err) {
                    showToast('Import Error', 'Invalid backup JSON file.', true);
                }
            };
            reader.readAsText(file);
        }

        function logout() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = null;
            localStorage.removeItem(DB_KEYS.CURRENT_USER);
            showToast('Signed Out', 'Session closed safely.');
            renderApp();
        }

        // --- APP INITIALIZATION ---
        window.onload = async function() {
            initDatabase();
            renderApp();
            if (getCloudSyncUrl()) {
                await pullFromCloud(false);
            } else {
                setCloudBadgeStatus('local', 'Local Mode');
            }
        };
    </script>
</body>
</html>
